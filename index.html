<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lt. Danny Cruz Retirement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: full-bleed photo stage over a blurred, ember-lit backdrop; the
   header and footer read like the gold-leaf lettering on an apparatus door. */
:root {
  --soot: #15110e;
  --soot-2: #231c17;
  --engine: #b5121b;
  --engine-hi: #e2372c;
  --brass: #f9be04;      /* gold sampled from the HFD monogram */
  --leaf-hi: #ffd84d;
  --leaf-lo: #a67c00;
  --smoke: #f2ebe0;
  --ash: #a89d8e;
  --ember: #ff8a3d;
  --scrim: rgba(15, 11, 9, 0.72);

  --f-display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --f-label: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;

  --gutter: clamp(16px, 3vw, 36px);
  --dur: 6500ms;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--soot);
  color: var(--smoke);
  font-family: var(--f-body);
  font-size: 16px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* ---------- Backdrop ---------- */
.backdrops, #embers, #flames { position: fixed; inset: 0; pointer-events: none; }
.backdrops { z-index: 0; background: var(--soot); }
.backdrop {
  position: absolute; inset: -40px;
  background-size: cover; background-position: center;
  filter: blur(32px) saturate(1.1) brightness(0.5);
  opacity: 0; transition: opacity 1.4s ease;
}
.backdrop.on { opacity: 1; }
.backdrops::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(181, 18, 27, 0.35), transparent 60%),
    radial-gradient(ellipse at center, transparent 30%, var(--scrim) 100%);
}
#flames {
  z-index: 1; inset: -16px; width: calc(100% + 32px); height: calc(100% + 32px);
  filter: blur(5px) saturate(1.2); opacity: 0.85;
}
#embers { z-index: 1; }

/* ---------- App frame ---------- */
.app {
  position: fixed; inset: 0; z-index: 2;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
}
[hidden] { display: none !important; }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) var(--gutter) 12px;
  background: linear-gradient(to bottom, var(--scrim), transparent);
  transition: opacity 0.6s ease;
}
.dept { display: flex; align-items: center; gap: 12px; min-width: 0; }
.dept img { width: auto; height: 46px; flex: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.7)); }
.dept-text { min-width: 0; line-height: 1.1; }
.dept-name {
  font-family: var(--f-label); font-weight: 700; font-size: 1.05rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dept-sub {
  font-family: var(--f-label); font-weight: 500; font-size: 0.85rem;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ash);
}
.counter {
  font-family: var(--f-label); font-weight: 600; font-size: 0.95rem;
  letter-spacing: 0.08em; color: var(--ash); font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- Stage ---------- */
.stage { position: relative; min-height: 0; margin-inline: var(--gutter); container-type: size; }
.slide {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity 1.2s ease, visibility 0s linear 1.2s;
}
.slide.on { opacity: 1; visibility: visible; transition: opacity 1.2s ease, visibility 0s; }
.frame {
  position: relative; max-width: 100%; max-height: 100%;
  display: flex; overflow: hidden;
  border: 3px solid var(--brass);
  outline: 1px solid var(--leaf-lo); outline-offset: 4px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 48px rgba(249, 190, 4, 0.16);
}
.frame img {
  /* Scale up to fill the stage; --ar is set from each photo's real shape. */
  display: block; height: auto;
  width: min(calc(100cqw - 16px), calc((100cqh - 20px) * var(--ar, 0.75)));
  transform-origin: var(--origin, center);
}
.slide.on .frame img { animation: kenburns 9s ease-out forwards; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.07); } }

/* ---------- Title + closing cards ---------- */
.card {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  align-items: center; gap: clamp(20px, 4vw, 56px);
  max-width: 1500px; width: 100%;
}
.card .emblem { width: clamp(140px, min(30cqw, 56cqh), 420px); height: auto; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.6)); }
.card-text, .caption, .top { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 18px rgba(0, 0, 0, 0.75); }
.card-text { min-width: 0; }
.eyebrow {
  font-family: var(--f-label); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.22em; font-size: clamp(0.85rem, min(1.6cqw, 2.6cqh), 1.35rem); color: var(--engine-hi);
  margin: 0 0 12px;
}
.leaf {
  font-family: var(--f-display); font-weight: 400; line-height: 0.98;
  margin: 0; text-wrap: balance;
  color: var(--brass);
  filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.65)) drop-shadow(0 0 18px rgba(0, 0, 0, 0.55));
}
.leaf.xl { font-size: clamp(2.8rem, min(11.5cqw, 18cqh), 10.5rem); }
.leaf.lg { font-size: clamp(2.4rem, min(8.4cqw, 12.5cqh), 7.8rem); }
.honoree {
  font-family: var(--f-label); font-weight: 700; text-transform: uppercase;
  font-size: clamp(1.7rem, min(5cqw, 7.5cqh), 4.4rem); letter-spacing: 0.06em;
  margin: 14px 0 0; color: var(--smoke);
  display: flex; align-items: center; gap: 14px;
}
.honoree::before {
  content: ""; flex: none; width: clamp(28px, 5vw, 56px); height: 4px; background: var(--engine);
}
.card p.note {
  font-size: clamp(1rem, min(1.9cqw, 3cqh), 1.6rem); line-height: 1.5; color: var(--ash);
  max-width: 48ch; margin: 18px 0 0;
}

/* ---------- Footer ---------- */
.bottom {
  display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr);
  padding: 14px var(--gutter) calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--scrim) 40%, transparent);
}
.progress { height: 4px; background: rgba(242, 235, 224, 0.12); }
.progress i {
  display: block; position: relative; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--engine), var(--engine-hi) 75%, var(--ember));
  box-shadow: 0 0 10px rgba(226, 55, 44, 0.55);
}
/* A glowing ember rides the leading edge of the timer. */
.progress i::after {
  content: ""; position: absolute; right: -5px; top: 50%;
  width: 10px; height: 10px; margin-top: -5px; border-radius: 50%;
  background: var(--leaf-hi);
  box-shadow: 0 0 8px 3px var(--ember), 0 0 22px 7px rgba(226, 55, 44, 0.55);
  animation: flicker 0.9s ease-in-out infinite alternate;
}
.progress i.run { animation: fill var(--dur) linear forwards; }
.paused .progress i.run, .paused .progress i::after { animation-play-state: paused; }
@keyframes fill { from { width: 0; } to { width: 100%; } }
@keyframes flicker { from { opacity: 0.75; transform: scale(0.85); } to { opacity: 1; transform: scale(1.15); } }

.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.caption { min-width: 0; flex: 1 1 280px; min-height: 3.1em; }
.caption .chapter {
  font-family: var(--f-label); font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.2em; font-size: 0.85rem; color: var(--brass);
}
.caption .line {
  font-family: var(--f-label); font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.9rem);
  line-height: 1.15; color: var(--smoke); margin-top: 2px;
}

.controls { display: flex; gap: 8px; transition: opacity 0.6s ease; }
.btn {
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid rgba(249, 190, 4, 0.55); background: rgba(21, 17, 14, 0.55);
  cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
}
.btn:hover { background: var(--engine); border-color: var(--engine-hi); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(181, 18, 27, 0.45); }
.btn:active { transform: translateY(0) scale(0.94); }
.btn:focus-visible, .thumb:focus-visible { outline: 2px solid var(--leaf-hi); outline-offset: 2px; }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.btn.play { background: var(--engine); border-color: var(--engine-hi); }

.thumbs {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px;
  scrollbar-width: thin; transition: opacity 0.6s ease;
}
.thumb {
  flex: none; width: 64px; height: 44px; padding: 0; cursor: pointer;
  border: 2px solid transparent; background: var(--soot-2); opacity: 0.55;
  transition: opacity 0.2s, border-color 0.2s, transform 0.25s, box-shadow 0.25s;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { opacity: 0.9; transform: translateY(-3px); }
.thumb.on { opacity: 1; border-color: var(--brass); box-shadow: 0 0 14px rgba(249, 190, 4, 0.5); }
.thumb.text {
  font-family: var(--f-label); font-weight: 700; font-size: 0.7rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--brass);
}

/* ---------- Motion ---------- */
/* Photos settle in like a print set down on the table, then a glint crosses the glass. */
.slide .frame {
  transform: scale(0.93) rotate(var(--tilt, -1deg)); filter: blur(6px);
  transition: transform 1.4s cubic-bezier(0.2, 0.8, 0.2, 1), filter 1s ease;
}
.slide.on .frame { transform: none; filter: none; }
.frame::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 38%, rgba(255, 244, 210, 0.3) 50%, transparent 62%);
  transform: translateX(-130%);
}
.slide.on .frame::after { animation: glint 1.5s ease-out 0.9s forwards; }
@keyframes glint { to { transform: translateX(130%); } }

/* Title cards assemble piece by piece each time they come up. */
.slide.on .card .emblem {
  animation: emblem-in 1.1s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.15s both,
             emblem-glow 3.5s ease-in-out 1.4s infinite;
}
@keyframes emblem-in { from { opacity: 0; transform: scale(0.55) rotate(-10deg); } }
@keyframes emblem-glow {
  0%, 100% { filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 8px rgba(255, 138, 61, 0.25)); }
  50% { filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 26px rgba(255, 138, 61, 0.65)); }
}
.slide.on .card .eyebrow { animation: slide-in 0.7s ease-out 0.45s both; }
.leaf .w { display: inline-block; }
.slide.on .leaf .w {
  /* Word-by-word rise, then a gold shine that sweeps across the lettering every few seconds. */
  text-shadow: none;
  background: linear-gradient(110deg, var(--brass) 0 42%, #fff5cf 50%, var(--brass) 58% 100%);
  background-size: 300% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: word-in 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) calc(0.6s + var(--i) * 0.1s) both,
             shine 6s ease-in-out calc(1.6s + var(--i) * 0.12s) infinite;
}
@keyframes word-in { from { opacity: 0; transform: translateY(0.45em); filter: blur(6px); } }
@keyframes shine { 0% { background-position: 100% 0; } 25%, 100% { background-position: 0 0; } }
.slide.on .honoree { animation: slide-in 0.7s ease-out 1.2s both; }
.honoree::before { transform-origin: left; }
.slide.on .honoree::before { animation: rule 0.6s ease-out 1.1s both; }
@keyframes rule { from { transform: scaleX(0); } }
.slide.on .card .note { animation: rise 0.8s ease-out 1.5s both; }
@keyframes slide-in { from { opacity: 0; transform: translateX(-18px); } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

.caption.enter .chapter { animation: slide-in 0.6s ease-out 0.35s both; }
.caption.enter .line { animation: rise 0.7s ease-out 0.5s both; }

/* ---------- Music ---------- */
.top-right { display: flex; align-items: center; gap: 16px; }
.music-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
  font-family: var(--f-label); font-weight: 700; font-size: 0.9rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--soot); background: var(--brass); border: 0; cursor: pointer;
  box-shadow: 0 0 18px rgba(249, 190, 4, 0.35); transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
}
.music-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(249, 190, 4, 0.55); }
.music-btn:focus-visible { outline: 2px solid var(--leaf-hi); outline-offset: 3px; }
.music-btn svg { width: 16px; height: 16px; fill: currentColor; }
.music-on .music-btn { color: var(--brass); background: rgba(21, 17, 14, 0.6); border: 1px solid rgba(249, 190, 4, 0.55); box-shadow: none; }

/* The jukebox: a brass-trimmed panel holding the (always visible) YouTube player. */
.jukebox {
  position: fixed; z-index: 3; right: var(--gutter); top: calc(78px + env(safe-area-inset-top, 0px));
  width: 230px; padding: 14px; display: grid; gap: 10px;
  background: rgba(21, 17, 14, 0.85); border: 1px solid rgba(249, 190, 4, 0.5);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 30px rgba(249, 190, 4, 0.12);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  animation: rise 0.6s ease-out both;
}
.jukebox .label {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--f-label); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--engine-hi);
}
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.eq i { width: 3px; height: 30%; background: var(--brass); }
.jukebox.live .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
.jukebox.live .eq i:nth-child(2) { animation-delay: -0.3s; }
.jukebox.live .eq i:nth-child(3) { animation-delay: -0.6s; }
@keyframes eq { from { height: 20%; } to { height: 100%; } }
.yt-wrap { width: 200px; height: 200px; background: #000; border: 2px solid var(--brass); }
.yt-wrap iframe, #yt { display: block; width: 200px; height: 200px; border: 0; }
.song { min-width: 0; }
.song-title {
  font-family: var(--f-label); font-weight: 700; font-size: 1.15rem; line-height: 1.15; color: var(--smoke);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.song-artist { font-size: 0.9rem; color: var(--brass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-next { font-size: 0.75rem; color: var(--ash); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-note { font-size: 0.8rem; color: var(--leaf-hi); }
.music-note:empty { display: none; }
.jukebox .controls { gap: 6px; }
.jukebox .btn { width: 38px; height: 38px; }
.jukebox .btn svg { width: 18px; height: 18px; }

@media (min-width: 901px) {
  .music-on .stage { margin-right: calc(var(--gutter) + 246px); }
}
@media (max-width: 900px) {
  /* On small screens the jukebox sits in the footer instead of floating over the photos. */
  .jukebox { position: static; width: auto; grid-template-columns: 200px minmax(0, 1fr); align-items: start; }
  .jukebox .label { grid-column: 1 / -1; }
  .jukebox .yt-wrap { grid-row: span 3; }
}
@media (max-width: 600px) {
  .dept-name { font-size: 0.88rem; letter-spacing: 0.1em; }
  .music-btn span { display: none; }
  .music-btn { padding: 0 11px; }
}

/* Hide the chrome while the show runs untouched (projector mode). */
.idle .top, .idle .controls, .idle .thumbs { opacity: 0; }
.idle { cursor: none; }

@media (max-width: 600px) {
  .card { grid-template-columns: 1fr; justify-items: start; }
  .card .emblem { width: min(46cqw, 24cqh); }
  .leaf.xl { font-size: clamp(2.6rem, 13cqw, 4.2rem); }
  .leaf.lg { font-size: clamp(2.2rem, 11.5cqw, 3.8rem); }
  .counter { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important; animation-delay: 0s !important;
    animation-iteration-count: 1 !important; transition-duration: 0.01ms !important;
  }
  .progress i.run { animation-duration: var(--dur) !important; }
  .slide .frame { transform: none; filter: none; }
}
</style>
</head>
<body>

<div class="backdrops" id="backdrops"></div>
<canvas id="flames" aria-hidden="true"></canvas>
<canvas id="embers" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="top">
    <div class="dept">
      <img src="assets/hfd-monogram.png" alt="Hartford Fire Department monogram">
      <div class="dept-text">
        <div class="dept-name">Hartford Fire Department</div>
        <div class="dept-sub">Class 1 · Hartford, Connecticut</div>
      </div>
    </div>
    <div class="top-right">
      <button class="music-btn" id="music-btn" type="button" aria-label="Play music">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
        <span id="music-btn-text">Play music</span>
      </button>
      <div class="counter" id="counter" aria-live="polite"></div>
    </div>
  </header>

  <main class="stage" id="stage" aria-roledescription="slideshow"></main>

  <footer class="bottom">
    <aside class="jukebox" id="jukebox" aria-label="Music" hidden>
      <div class="label"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Now playing</div>
      <div class="yt-wrap"><div id="yt"></div></div>
      <div class="song">
        <div class="song-title" id="song-title"></div>
        <div class="song-artist" id="song-artist"></div>
        <div class="song-next" id="song-next"></div>
      </div>
      <div class="music-note" id="music-note" role="status"></div>
      <div class="controls">
        <button class="btn" id="song-prev" type="button" aria-label="Previous song">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM9.5 12 18 5v14z"/></svg>
        </button>
        <button class="btn play" id="song-play" type="button" aria-label="Pause music">
          <svg viewBox="0 0 24 24" id="song-play-icon"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="btn" id="song-next-btn" type="button" aria-label="Next song">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5l8.5 7L6 19z"/></svg>
        </button>
      </div>
    </aside>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="row">
      <div class="caption" id="caption">
        <div class="chapter" id="chapter"></div>
        <div class="line" id="line"></div>
      </div>
      <div class="controls">
        <button class="btn" id="prev" type="button" aria-label="Previous photo">
          <svg viewBox="0 0 24 24"><path d="M15.5 4 7.5 12l8 8 1.4-1.4L10.3 12l6.6-6.6z"/></svg>
        </button>
        <button class="btn play" id="play" type="button" aria-label="Pause slideshow">
          <svg viewBox="0 0 24 24" id="play-icon"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        </button>
        <button class="btn" id="next" type="button" aria-label="Next photo">
          <svg viewBox="0 0 24 24"><path d="M8.5 4 7.1 5.4 13.7 12l-6.6 6.6L8.5 20l8-8z"/></svg>
        </button>
        <button class="btn" id="full" type="button" aria-label="Full screen">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg>
        </button>
      </div>
    </div>
    <nav class="thumbs" id="thumbs" aria-label="Jump to a photo"></nav>
  </footer>
</div>

<script>
/* ================================================================
   EDIT HERE: name, messages, and photo captions.
   Photos are shown in this order. To add a photo, upload it to the
   "DCRUZ PHOTOS" folder and add a line below with its file name.
   ================================================================ */
const HONOREE = "Lt. Danny Cruz";
const OPENING = {
  eyebrow: "Hartford Fire Department",
  title: "Happy Retirement",
  note: "Thank you for your years of service to the City of Hartford. Enjoy a look back at the job, the crew, and the good times."
};
const CLOSING = {
  eyebrow: "Congratulations, " + HONOREE,
  title: "Your shift is over. We've got it from here.",
  note: "From your brothers and sisters of the Hartford Fire Department. Stay safe and enjoy every day of retirement."
};
const PHOTO_FOLDER = "DCRUZ PHOTOS/";

  { file: "CRUZIN_INTO_RETIREMENT.jpg", chapter: "Lt. Danny Cruz", caption: "Cruz'in into retirement. Lights on, thumbs up." },

const SECONDS_PER_PHOTO = 6.5;

const $ = (id) => document.getElementById(id);
const app = $("app"), stage = $("stage"), thumbs = $("thumbs"), backdrops = $("backdrops");
const bar = $("bar");
const src = (f) => encodeURI(PHOTO_FOLDER + f);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const origins = ["center", "30% 30%", "70% 40%", "40% 70%", "60% 25%"];

const slides = [
  { kind: "title", ...OPENING },
  ...PHOTOS.map((p) => ({ kind: "photo", ...p })),
  { kind: "title", ...CLOSING, closing: true }
];

function cardHTML(s) {
  return `<div class="card">
    <img class="emblem" src="assets/hfd-monogram.png" alt="">
    <div class="card-text">
      <p class="eyebrow">${esc(s.eyebrow)}</p>
      <h1 class="leaf ${s.closing ? "lg" : "xl"}">${s.title.split(" ").map((w, i) =>
        `<span class="w" style="--i:${i}">${esc(w)}</span>`).join(" ")}</h1>
      ${s.closing ? "" : `<p class="honoree">${esc(HONOREE)}</p>`}
      <p class="note">${esc(s.note)}</p>
    </div>
  </div>`;
}

slides.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.setAttribute("aria-roledescription", "slide");
  el.setAttribute("aria-label", `${i + 1} of ${slides.length}`);
  if (s.kind === "photo") {
    el.innerHTML = `<div class="frame"><img src="${src(s.file)}" alt="${esc(s.caption)}" decoding="async"></div>`;
    const img = el.querySelector("img");
    img.style.setProperty("--origin", origins[i % origins.length]);
    const setAr = () => img.naturalWidth && img.style.setProperty("--ar", img.naturalWidth / img.naturalHeight);
    img.complete ? setAr() : img.addEventListener("load", setAr);
  } else {
    el.innerHTML = cardHTML(s);
  }
  stage.appendChild(el);
  s.el = el;

  const bd = document.createElement("div");
  bd.className = "backdrop";
  if (s.kind === "photo") bd.style.backgroundImage = `url("${src(s.file)}")`;
  backdrops.appendChild(bd);
  s.bd = bd;

  const t = document.createElement("button");
  t.type = "button";
  t.className = "thumb" + (s.kind === "photo" ? "" : " text");
  t.setAttribute("aria-label", s.kind === "photo" ? `Photo: ${s.caption}` : (s.closing ? "Closing message" : "Opening title"));
  t.innerHTML = s.kind === "photo" ? `<img src="${src(s.file)}" alt="" loading="lazy">` : (s.closing ? "End" : "Start");
  t.addEventListener("click", () => go(i));
  thumbs.appendChild(t);
  s.thumb = t;
});

let cur = -1;
const fx = { dim: false, burst: null };   // shared with the ember and flame effects
let playing = true;

function go(i) {
  i = (i + slides.length) % slides.length;
  if (cur >= 0) {
    const old = slides[cur];
    old.el.classList.remove("on"); old.bd.classList.remove("on"); old.thumb.classList.remove("on");
    old.thumb.removeAttribute("aria-current");
  }
  cur = i;
  const s = slides[i];
  s.el.classList.add("on"); s.bd.classList.add("on"); s.thumb.classList.add("on");
  s.thumb.setAttribute("aria-current", "true");
  s.thumb.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });

  // Restart the Ken Burns zoom on revisit.
  const img = s.el.querySelector(".frame img");
  if (img) { img.style.animation = "none"; void img.offsetWidth; img.style.animation = ""; }

  s.el.style.setProperty("--tilt", (i % 2 ? 1.2 : -1.2) + "deg");
  const cap = $("caption");
  cap.classList.remove("enter"); void cap.offsetWidth; cap.classList.add("enter");

  // Sparks fly off the monogram once it lands on a title card.
  const emblem = s.el.querySelector(".emblem");
  if (emblem) setTimeout(() => {
    if (cur !== i || !fx.burst) return;
    const r = emblem.getBoundingClientRect();
    fx.burst(r.left + r.width / 2, r.top + r.height / 2);
  }, 750);

  $("chapter").textContent = s.kind === "photo" ? s.chapter : "";
  $("line").textContent = s.kind === "photo" ? s.caption : "";
  $("counter").textContent = s.kind === "photo"
    ? `Photo ${slides.indexOf(s)} of ${PHOTOS.length}`
    : (s.closing ? "Thank you" : "Welcome");

  const secs = s.kind === "photo" ? SECONDS_PER_PHOTO : SECONDS_PER_TITLE;
  document.documentElement.style.setProperty("--dur", secs * 1000 + "ms");
  bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");
}

bar.addEventListener("animationend", () => { if (playing) go(cur + 1); });

function setPlaying(p) {
  playing = p;
  app.classList.toggle("paused", !p);
  $("play").setAttribute("aria-label", p ? "Pause slideshow" : "Play slideshow");
  $("play-icon").innerHTML = p
    ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  if (p) wake(); else release();
  poke();
}

$("prev").addEventListener("click", () => { go(cur - 1); poke(); });
$("next").addEventListener("click", () => { go(cur + 1); poke(); });
$("play").addEventListener("click", () => setPlaying(!playing));
$("full").addEventListener("click", toggleFull);

function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch (e) { /* fullscreen not available here */ }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") { go(cur + 1); poke(); }
  else if (e.key === "ArrowLeft") { go(cur - 1); poke(); }
  else if (e.key === " " && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "f" || e.key === "F") toggleFull();
  else if (e.key === "m" || e.key === "M") music.toggle();
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(slides.length - 1);
});

// Swipe on phones and tablets.
let sx = null;
stage.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
  sx = null; poke();
});

// Fade the controls after a few seconds without mouse movement.
let idleTimer;
function poke() {
  app.classList.remove("idle"); document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (playing) { app.classList.add("idle"); document.body.classList.add("idle"); }
  }, 3500);
}
["mousemove", "pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, poke, { passive: true }));

// Keep the screen awake while the show plays (ignored where unsupported).
let lock = null;
async function wake() { try { lock = await navigator.wakeLock?.request("screen"); } catch (e) { lock = null; } }
function release() { try { lock?.release(); } catch (e) {} lock = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && playing) wake(); });

/* ---------- Embers ---------- */
(function embers() {
  const cv = $("embers"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, parts = [];
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  }
  function spawn(y) {
    return { x: Math.random() * w, y: y ?? h + Math.random() * 40, r: (0.6 + Math.random() * 1.8) * dpr,
      vy: (0.25 + Math.random() * 0.7) * dpr, vx: (Math.random() - 0.5) * 0.3 * dpr,
      life: 0.35 + Math.random() * 0.5, ph: Math.random() * 6.28 };
  }
  size(); addEventListener("resize", size);
  const n = Math.round(Math.min(50, innerWidth / 30));
  for (let i = 0; i < n; i++) parts.push(spawn(Math.random() * h));

  // Sparks: a radial burst with gravity, used on the title cards.
  let sparks = [];
  if (!still) fx.burst = (x, y) => {
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * 6.283, v = (2 + Math.random() * 7) * dpr;
      sparks.push({ x: x * dpr, y: y * dpr, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2 * dpr,
        r: (0.8 + Math.random() * 1.6) * dpr, life: 1, decay: 0.012 + Math.random() * 0.02,
        gold: Math.random() < 0.55 });
    }
  };

  let ambient = 1;   // ambient embers fade out while the big fire burns
  function draw() {
    ctx.clearRect(0, 0, w, h);
    ambient += ((fx.dim ? 0 : 1) - ambient) * 0.03;
    ctx.shadowColor = "rgba(255, 90, 30, 0.9)"; ctx.shadowBlur = 8 * dpr;
    for (const p of parts) {
      if (!still) {
        p.y -= p.vy; p.ph += 0.02; p.x += p.vx + Math.sin(p.ph) * 0.25 * dpr;
        if (p.y < -10) Object.assign(p, spawn());
      }
      const a = ambient * p.life * Math.min(1, p.y / h + 0.15);
      if (a < 0.01) continue;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255, 138, 61, ${a})`;
      ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    for (const k of sparks) {
      k.x += k.vx; k.y += k.vy; k.vx *= 0.97; k.vy = k.vy * 0.97 + 0.12 * dpr; k.life -= k.decay;
      if (k.life <= 0) continue;
      ctx.beginPath();
      ctx.fillStyle = k.gold ? `rgba(255, 214, 90, ${k.life})` : `rgba(255, 120, 40, ${k.life})`;
      ctx.arc(k.x, k.y, k.r, 0, 6.283); ctx.fill();
    }
    sparks = sparks.filter((k) => k.life > 0);
    if (!still) requestAnimationFrame(draw);
  }
  draw();
})();

/* ---------- Flames ----------
   The background alternates between drifting embers and a full fire.
   A small fire simulation is fed from the bottom row: raising the feed
   grows the flames up the screen, cutting it lets them burn back down. */
(function flames() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("flames"), ctx = cv.getContext("2d");
  const EMBER_SECONDS = 16, FLAME_SECONDS = 16, IGNITION_SECONDS = 4, HOT = 34, ROWS = 110;
  // Heat ramp: transparent -> deep red -> orange -> monogram gold -> pale flame.
  const STOPS = [[0, 20, 4, 2], [0.3, 150, 18, 4], [0.55, 225, 70, 6], [0.8, 249, 160, 10], [1, 255, 222, 110]];
  const PAL = [];
  for (let v = 0; v <= HOT; v++) {
    const t = v / HOT;
    let k = 1; while (STOPS[k][0] < t) k++;
    const [t0, ...a] = STOPS[k - 1], [t1, ...b] = STOPS[k], f = (t - t0) / (t1 - t0);
    PAL.push(...a.map((c, i) => Math.round(c + (b[i] - c) * f)));
  }
  let W, fire, img;
  function size() {
    W = Math.max(80, Math.min(260, Math.round(ROWS * innerWidth / innerHeight)));
    cv.width = W; cv.height = ROWS;
    fire = new Uint8Array(W * ROWS);
    img = ctx.createImageData(W, ROWS);
  }
  size(); addEventListener("resize", size);

  // Opens with a short flare-up that burns down to reveal the title.
  let burning = true, phaseLen = IGNITION_SECONDS, phaseStart = performance.now(), feed = 0, last = 0;
  fx.dim = true;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 33) return;          // about 30 fps is plenty for fire
    last = now;
    if ((now - phaseStart) / 1000 > phaseLen) {
      burning = !burning; phaseStart = now;
      phaseLen = burning ? FLAME_SECONDS : EMBER_SECONDS;
      fx.dim = burning;
    }
    feed += ((burning ? HOT : 0) - feed) * (phaseLen === IGNITION_SECONDS ? 0.06 : 0.02);

    const base = (ROWS - 1) * W;
    for (let x = 0; x < W; x++) fire[base + x] = Math.max(0, Math.round(feed - Math.random() * 3));
    for (let x = 0; x < W; x++) {
      for (let y = 1; y < ROWS; y++) {
        const src = y * W + x, v = fire[src];
        if (v === 0) { fire[src - W] = 0; continue; }
        const r = (Math.random() * 3) | 0;
        const dst = src - W - r + 1;
        if (dst >= 0) fire[dst] = Math.max(0, v - (r & 1));
      }
    }
    const d = img.data;
    for (let i = 0; i < fire.length; i++) {
      const v = fire[i], o = i * 4, c = v * 3;
      d[o] = PAL[c]; d[o + 1] = PAL[c + 1]; d[o + 2] = PAL[c + 2];
      d[o + 3] = v === 0 ? 0 : Math.min(255, 20 + v * 9);
    }
    ctx.putImageData(img, 0, 0);
  }
  requestAnimationFrame(frame);
})();

/* ---------- Music ----------
   Uses YouTube's embedded player, which has to stay visible on screen.
   Browsers only allow sound after someone clicks, so music starts from a button. */
const music = (function () {
  const box = $("jukebox"), noteEl = $("music-note");
  const totalIds = SONGS.reduce((n, s) => n + s.ids.length, 0);
  let player = null, apiReady = false, wanted = false, playing = false;
  let si = 0, ci = 0, fails = 0, tapHint;

  // Load YouTube's player code in the background so the first click starts music quickly.
  window.onYouTubeIframeAPIReady = () => { apiReady = true; if (wanted) create(); };
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api"; tag.async = true;
  tag.onerror = () => note("The music player couldn't load. Check the internet connection.");
  document.head.appendChild(tag);

  function note(t) { noteEl.textContent = t; }
  function label() {
    const s = SONGS[si];
    $("song-title").textContent = s.title;
    $("song-artist").textContent = s.artist;
    $("song-next").textContent = "Up next: " + SONGS[(si + 1) % SONGS.length].title;
  }
  function setButtons() {
    $("music-btn-text").textContent = playing ? "Pause music" : "Play music";
    $("music-btn").setAttribute("aria-label", playing ? "Pause music" : "Play music");
    $("song-play").setAttribute("aria-label", playing ? "Pause music" : "Play music");
    $("song-play-icon").innerHTML = playing
      ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    box.classList.toggle("live", playing);
  }
  function create() {
    wanted = false;
    player = new YT.Player("yt", {
      width: 200, height: 200, videoId: SONGS[si].ids[ci],
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin },
      events: {
        onReady: (e) => {
          e.target.setVolume(MUSIC_VOLUME); e.target.playVideo();
          tapHint = setTimeout(() => { if (!playing) note("Tap the video once to start the music."); }, 4000);
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) { playing = true; fails = 0; note(""); clearTimeout(tapHint); }
          else if (e.data === YT.PlayerState.PAUSED) playing = false;
          else if (e.data === YT.PlayerState.ENDED) { step(1); return; }
          setButtons();
        },
        onError: () => {
          // This upload can't play here: try the song's next upload, then the next song.
          if (++fails >= totalIds) { note("None of the songs could play here. Check the internet connection."); return; }
          if (ci + 1 < SONGS[si].ids.length) { ci++; load(); } else step(1);
        }
      }
    });
  }
  function load() { label(); player.loadVideoById(SONGS[si].ids[ci]); }
  function step(d) {
    si = (si + d + SONGS.length) % SONGS.length; ci = 0;
    if (player) load(); else label();
  }
  function start() {
    box.hidden = false; app.classList.add("music-on"); label();
    if (player) return;
    if (apiReady) create(); else { wanted = true; note("Loading music…"); }
  }
  function toggle() {
    if (!player || box.hidden) return start();
    playing ? player.pauseVideo() : player.playVideo();
  }
  $("music-btn").addEventListener("click", toggle);
  $("song-play").addEventListener("click", toggle);
  $("song-prev").addEventListener("click", () => step(-1));
  $("song-next-btn").addEventListener("click", () => step(1));
  return { toggle };
})();

go(0);
setPlaying(true);
</script>
</body>
</html>
